<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>捣蛋大鹅</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="layout">
    <section class="panel">
      <h1>捣蛋大鹅</h1>
      <div class="view-badge">2.5D 斜视角</div>
      <p>目标：偷走院子里的物品，再跑回池塘出口。</p>
      <ul>
        <li>移动：WASD / 方向键</li>
        <li>鸣叫：空格</li>
        <li>互动：E 键</li>
        <li>右侧游戏区全屏：H 键</li>
        <li>场景：已切换为带高度层次的 3D 风格视角</li>
        <li>躲进草丛可以降低被发现的概率</li>
      </ul>
      <div class="hud">
        <div id="level">关卡：第 1 关</div>
        <div id="status">状态：潜行中</div>
        <div id="progress">战利品：0 / 4</div>
        <div id="hint">提示：先去偷花园里的东西。</div>
      </div>
      <div class="customize">
        <h3>外观自定义</h3>
        <label for="outfitSelect">服装</label>
        <select id="outfitSelect">
          <option value="cool">酷感外套</option>
          <option value="sailor">水手服</option>
          <option value="armor">轻甲战袍</option>
          <option value="king">王的套装</option>
        </select>
        <label for="hatSelect">帽子</label>
        <select id="hatSelect">
          <option value="straw">草帽</option>
          <option value="beanie">毛线帽</option>
          <option value="wizard">魔法帽</option>
        </select>
        <label for="weaponSelect">武器</label>
        <select id="weaponSelect">
          <option value="umbrella">雨伞</option>
          <option value="woodSword">木剑</option>
          <option value="hammer">玩具锤</option>
        </select>
      </div>
      <button id="restart">重新开始</button>
    </section>
    <section class="game-shell">
      <canvas id="game" width="960" height="540"></canvas>
    </section>
  </div>
  <script src="/levels.js"></script>
  <script src="/interactions.js"></script>
  <script src="/script.js"></script>
</body>
</html>
